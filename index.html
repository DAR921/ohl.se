<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الخطوط بتهامة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    font-family:Arial;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* خلفية طاقة */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(270deg,#001f3f,#0074D9,#001f3f);
    background-size:600% 600%;
    animation:energy 10s ease infinite;
    z-index:-1;
}

@keyframes energy{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* الحاوية */
.container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    flex-wrap:wrap;
}

/* الكارد */
.card{
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

/* أيقونات */
.card i{
    font-size:60px;
    width:120px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(0,150,255,0.15);
    border:2px solid rgba(0,150,255,0.5);
    box-shadow:0 0 20px rgba(0,150,255,0.7),
               inset 0 0 20px rgba(0,150,255,0.4);
    animation:pulseGlow 2s infinite;
}

@keyframes pulseGlow{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

.card:hover i{
    transform:scale(1.25);
    box-shadow:0 0 40px rgba(0,150,255,1);
}

.card span{
    display:block;
    margin-top:15px;
    font-size:18px;
}

/* الفوتر */
footer{
    width:100%;
    text-align:center;
    padding:15px;
    font-size:14px;
    background:linear-gradient(270deg,#0074D9,#001f3f,#0074D9);
    background-size:400% 400%;
    animation:footerMove 6s infinite;
}

@keyframes footerMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* 🔥 تعديل الجوال */
@media (max-width:768px){

    body{
        overflow:auto;
    }

    .container{
        flex-direction:column;
        gap:25px;
        padding-top:40px;
    }

    .card i{
        width:80px;
        height:80px;
        font-size:35px;
    }

    .card span{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="card" onclick="goPage('pages/security.html')">
        <i class="fas fa-bolt"></i>
        <span>تصاريح</span>
    </div>

    <div class="card" onclick="goPage('pages/investigation.html')">
        <i class="fas fa-bolt"></i>
        <span>اجراءات العمل</span>
    </div>

    <div class="card" onclick="goPage('pages/support.html')">
        <i class="fas fa-bolt"></i>
        <span>تقيم المخاطر</span>
    </div>

</div>

<footer>
 قسم الخطوط بتهامة
</footer>

<script>
function goPage(page){
    window.location.href = page;
}
</script>

</body>
</html>
